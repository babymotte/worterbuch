[workspace]
members = [
    "worterbuch-common",
    "worterbuch-client",
    "worterbuch",
    "worterbuch-cluster-orchestrator",
    "worterbuch-cli",
    "worterbuch-tui",
    "worterbuch-test",
]
resolver = "3"

[workspace.dependencies]
# Internal crates
worterbuch-common = { version = "1.7.0-rc.12", path = "worterbuch-common" }
worterbuch-client = { version = "1.7.0-rc.12", path = "worterbuch-client" }

axum = "0.8.7"
axum-extra = "0.12.2"
axum-server = "0.9.2"
base64 = "0.23.1"
chrono = "0.4.45"
clap = "4.6"
console-subscriber = "0.5.0"
dotenvy = "0.15.7"
flate2 = "1.1"
futures = "0.3.34"
futures-core = "0.3.34"
futures-util = { version = "0.3.27", default-features = false }
gethostname = "1.0"
getrandom = "0.4.3"
hashbrown = "0.17.2"
hashlink = "0.12.1"
headers = "0.4.2"
hex = "0.4.3"
http = "1.5"
http-body-util = "0.1.5"
inferno = "0.12.8"
jemalloc_pprof = { version = "0.9.0", features = ["flamegraph"] }
jsonschema = { version = "0.63.0", default-features = false }
jsonwebtoken = "12.0"
lazy_static = "1.5"
libc = "0.2.191"
mappings = "0.7.0"
mdns-sd = "0.22.0"
miette = "7.5"
mio = { version = "1.2", default-features = false }
opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-otlp = "0.33.1"
opentelemetry-resource-detectors = "0.13.1"
opentelemetry-semantic-conventions = "0.33.1"
pprof_util = { version = "0.8.0", features = ["flamegraph"] }
quinn = "0.11.12"
rand = "0.10.4"
random_word = { version = "1.0", features = ["en"] }
redb = "4.4"
regex = "1.13"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
rustls-platform-verifier = "0.7.1"
schemars = "1.2"
serde = "1.0"
serde_json = "1.0"
serde_repr = "0.1.21"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
socket2 = { version = "0.6.5", features = ["all"] }
strum = { version = "0.28.0", features = ["derive"] }
supports-color = "3.0"
thiserror = "2.0"
tikv-jemalloc-ctl = { version = "0.7.0", features = ["stats"] }
tikv-jemallocator = { version = "0.7.0", features = [
    "profiling",
    "unprefixed_malloc_on_supported_platforms",
] }
tokio = "1.54"
tokio-process-terminate = "0.3.2"
tokio-stream = "0.1.19"
tokio-tungstenite = "0.30.0"
tokio-tungstenite-wasm = "0.9.0"
tosub = "4.0"
totils = { version = "1.5", features = ["while_select", "peekable_mpsc"] }
tower-http = "0.7.1"
tracing = "0.1.41"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = "0.3.20"
tungstenite = "0.30.0"
turso = "0.8.4"
uuid = "1.29"

[profile.release]
lto = "fat"
codegen-units = 1
# panic = "abort"
# strip = true
# debug = 0
opt-level = 3
